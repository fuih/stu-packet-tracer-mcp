<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stu-pt-bridge</title>
  <link rel="stylesheet" href="this-sm:style.css" />
</head>
<body>
  <div class="app">
    <header class="cli-header">
      <div class="title-row">
        <h1 class="cli-title"><span class="prompt-sigil">$</span> stu-pt-bridge <span class="cli-ver">v0.1.0</span></h1>
        <span id="protocol-badge" class="pill pill-muted">PROTO: --</span>
      </div>
      <div class="status-row">
        <span id="status-dot" class="dot dot-idle"></span>
        <span id="status-text" class="status-text">Waiting for server...</span>
        <span class="counter">EXEC: <strong id="cmd-count">0</strong></span>
      </div>
    </header>

    <section class="config-card">
      <div class="field-row">
        <label for="server-url">--url</label>
        <input id="server-url" type="text" value="http://127.0.0.1:54321" spellcheck="false" />
      </div>
      <div class="field-row">
        <label for="bridge-token">--token</label>
        <input id="bridge-token" type="password" placeholder="(optional STU_PT_BRIDGE_TOKEN)" spellcheck="false" />
      </div>
      <div class="controls">
        <button id="toggle-btn" class="btn btn-danger" type="button">Stop</button>
        <button id="clear-btn" class="btn btn-secondary" type="button">Clear</button>
        <span id="backoff-note" class="backoff-note"></span>
      </div>
    </section>

    <section class="last-cmd">
      <span class="label">&gt; last:</span>
      <span id="last-label" class="value">idle</span>
    </section>

    <section class="log-panel">
      <div class="log-header">
        <span>── STREAM / BRIDGE LOG ──</span>
        <span class="stream-hint">127.0.0.1</span>
      </div>
      <div id="log-list" class="log-list" role="log" aria-live="polite"></div>
      <div class="cli-footer-prompt">
        <span class="prompt-sigil">pt-bridge&gt;</span><span class="cursor">_</span>
      </div>
    </section>
  </div>

  <script src="this-sm:bridge.js"></script>
</body>
</html>
