<svg xmlns="http://www.w3.org/2000/svg" width="740" height="784" viewBox="0 0 740 784" role="img" aria-label="HUB - CLI">
  <rect x="0.5" y="0.5" width="739" height="783" rx="8" fill="#000000" stroke="#1F3B6D" stroke-width="1"/>
  <path d="M 0 8 Q 0 0 8 0 L 732 0 Q 740 0 740 8 L 740 32 L 0 32 Z" fill="#1F4E8C"/>
  <rect x="10" y="8" width="16" height="16" rx="2" fill="#0F2A52" stroke="#93C5FD" stroke-width="0.8"/>
  <text x="18" y="19" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="8.5" font-weight="700" fill="#FACC15">PT</text>
  <text x="34" y="20" font-family="'DejaVu Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">HUB - CLI</text>
  <text x="686" y="20" font-family="'DejaVu Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#E5E7EB">—</text>
  <rect x="703" y="11" width="9" height="9" fill="none" stroke="#E5E7EB" stroke-width="1.2"/>
  <text x="722" y="20" font-family="'DejaVu Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#E5E7EB">×</text>
  <g font-family="'DejaVu Sans Mono', 'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="14" fill="#C0C0C0">
    <text x="16" y="60" xml:space="preserve"><tspan fill="#00FF00" font-weight="700">HUB&gt;</tspan>enable</text>
    <text x="16" y="79" xml:space="preserve"><tspan fill="#00FF00" font-weight="700">HUB#</tspan>show ip interface brief</text>
    <text x="16" y="98" xml:space="preserve">Interface              IP-Address      OK? Method Status                Protocol</text>
    <text x="16" y="117" xml:space="preserve">GigabitEthernet0/0     10.0.0.1        YES manual <tspan fill="#00DD00">up</tspan>                    <tspan fill="#00DD00">up</tspan></text>
    <text x="16" y="136" xml:space="preserve">GigabitEthernet0/1     10.0.0.5        YES manual <tspan fill="#00DD00">up</tspan>                    <tspan fill="#00DD00">up</tspan></text>
    <text x="16" y="155" xml:space="preserve">GigabitEthernet0/2     10.0.0.9        YES manual <tspan fill="#00DD00">up</tspan>                    <tspan fill="#00DD00">up</tspan></text>
    <text x="16" y="174" xml:space="preserve">Vlan1                  unassigned      YES unset  <tspan fill="#FF5555" font-weight="700">administratively down</tspan> <tspan fill="#FF5555">down</tspan></text>
    <text x="16" y="193" xml:space="preserve"></text>
    <text x="16" y="212" xml:space="preserve"><tspan fill="#00FF00" font-weight="700">HUB#</tspan>show ip ospf neighbor</text>
    <text x="16" y="231" xml:space="preserve"></text>
    <text x="16" y="250" xml:space="preserve">Neighbor ID     Pri   State           Dead Time   Address         Interface</text>
    <text x="16" y="269" xml:space="preserve">192.168.0.1       0   FULL/  -        00:00:35    10.0.0.2        GigabitEthernet0/0</text>
    <text x="16" y="288" xml:space="preserve">192.168.1.1       0   FULL/  -        00:00:36    10.0.0.6        GigabitEthernet0/1</text>
    <text x="16" y="307" xml:space="preserve">192.168.2.1       0   FULL/  -        00:00:38    10.0.0.10       GigabitEthernet0/2</text>
    <text x="16" y="326" xml:space="preserve"></text>
    <text x="16" y="345" xml:space="preserve"><tspan fill="#00FF00" font-weight="700">HUB#</tspan>show ip route</text>
    <text x="16" y="364" xml:space="preserve">Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP</text>
    <text x="16" y="383" xml:space="preserve">       D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area</text>
    <text x="16" y="402" xml:space="preserve">       N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2</text>
    <text x="16" y="421" xml:space="preserve">       E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP</text>
    <text x="16" y="440" xml:space="preserve">       i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area</text>
    <text x="16" y="459" xml:space="preserve">       * - candidate default, U - per-user static route, o - ODR</text>
    <text x="16" y="478" xml:space="preserve">       P - periodic downloaded static route</text>
    <text x="16" y="497" xml:space="preserve"></text>
    <text x="16" y="516" xml:space="preserve">Gateway of last resort is not set</text>
    <text x="16" y="535" xml:space="preserve"></text>
    <text x="16" y="554" xml:space="preserve">     10.0.0.0/8 is variably subnetted, 6 subnets, 2 masks</text>
    <text x="16" y="573" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">C</tspan>       10.0.0.0/30 is directly connected, GigabitEthernet0/0</text>
    <text x="16" y="592" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">L</tspan>       10.0.0.1/32 is directly connected, GigabitEthernet0/0</text>
    <text x="16" y="611" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">C</tspan>       10.0.0.4/30 is directly connected, GigabitEthernet0/1</text>
    <text x="16" y="630" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">L</tspan>       10.0.0.5/32 is directly connected, GigabitEthernet0/1</text>
    <text x="16" y="649" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">C</tspan>       10.0.0.8/30 is directly connected, GigabitEthernet0/2</text>
    <text x="16" y="668" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">L</tspan>       10.0.0.9/32 is directly connected, GigabitEthernet0/2</text>
    <text x="16" y="687" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">O</tspan>    192.168.0.0/24 [110/2] via 10.0.0.2, 00:00:57, GigabitEthernet0/0</text>
    <text x="16" y="706" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">O</tspan>    192.168.1.0/24 [110/2] via 10.0.0.6, 00:00:57, GigabitEthernet0/1</text>
    <text x="16" y="725" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">O</tspan>    192.168.2.0/24 [110/2] via 10.0.0.10, 00:00:57, GigabitEthernet0/2</text>
    <text x="16" y="744" xml:space="preserve"></text>
    <text x="16" y="763" xml:space="preserve"><tspan fill="#00FF00" font-weight="700">HUB#</tspan></text>
  </g>
</svg>
