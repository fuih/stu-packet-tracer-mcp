  <text x="680" y="763" text-anchor="middle" font-family="'DejaVu Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#111111">Paste</text>
  <rect x="14" y="789" width="13" height="13" rx="1.5" fill="#FFFFFF" stroke="#9B9B9B" stroke-width="1"/>
  <text x="33" y="800" font-family="'DejaVu Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" fill="#222222">Top</text>
