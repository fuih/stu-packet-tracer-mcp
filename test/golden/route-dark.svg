<svg xmlns="http://www.w3.org/2000/svg" width="648" height="254" viewBox="0 0 648 254" role="img" aria-label="R1 - CLI">
  <rect x="0.5" y="0.5" width="647" height="253" rx="8" fill="#0C0C0C" stroke="#2D2D2D" stroke-width="1"/>
  <path d="M 0 8 Q 0 0 8 0 L 640 0 Q 648 0 648 8 L 648 34 L 0 34 Z" fill="#1F242D"/>
  <line x1="0" y1="34" x2="648" y2="34" stroke="#30363D" stroke-width="1"/>
  <circle cx="18" cy="17" r="5.5" fill="#FF5F56"/>
  <circle cx="36" cy="17" r="5.5" fill="#FFBD2E"/>
  <circle cx="54" cy="17" r="5.5" fill="#27C93F"/>
  <text x="324" y="21" text-anchor="middle" font-family="'DejaVu Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#E5E7EB">R1 - CLI</text>
  <g font-family="'DejaVu Sans Mono', 'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="14" fill="#D4D4D4">
    <text x="16" y="62" xml:space="preserve"><tspan fill="#4ADE80" font-weight="700">R1#</tspan> show ip route</text>
    <text x="16" y="81" xml:space="preserve">Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP</text>
    <text x="16" y="100" xml:space="preserve">Gateway of last resort is 10.0.0.2 to network 0.0.0.0</text>
    <text x="16" y="119" xml:space="preserve"></text>
    <text x="16" y="138" xml:space="preserve">     10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks</text>
    <text x="16" y="157" xml:space="preserve"><tspan fill="#60A5FA" font-weight="700">C</tspan>       10.0.0.0/30 is directly connected, Serial0/0/0</text>
    <text x="16" y="176" xml:space="preserve"><tspan fill="#60A5FA" font-weight="700">L</tspan>       10.0.0.1/32 is directly connected, Serial0/0/0</text>
    <text x="16" y="195" xml:space="preserve"><tspan fill="#60A5FA" font-weight="700">C</tspan>       192.168.1.0/24 is directly connected, GigabitEthernet0/0</text>
    <text x="16" y="214" xml:space="preserve"><tspan fill="#60A5FA" font-weight="700">S*</tspan>   0.0.0.0/0 [1/0] via 10.0.0.2</text>
    <text x="16" y="233" xml:space="preserve"><tspan fill="#4ADE80" font-weight="700">R1#</tspan></text>
  </g>
</svg>
