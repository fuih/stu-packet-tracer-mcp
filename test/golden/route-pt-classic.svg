  <path d="M 0 8 Q 0 0 8 0 L 640 0 Q 648 0 648 8 L 648 60 L 0 60 Z" fill="#E6EAF0"/>
  <line x1="0" y1="32" x2="648" y2="32" stroke="#C5CDD8" stroke-width="1"/>
