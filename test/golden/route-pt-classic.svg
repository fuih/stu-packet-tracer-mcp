  <text x="19" y="19" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="9" font-weight="700" fill="#FFFFFF">&gt;_</text>
  <text x="34" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#1F2937">R1 - CLI</text>
  <text x="594" y="20" font-family="sans-serif" font-size="12" fill="#4B5563">—</text>
  <rect x="611" y="11" width="9" height="9" fill="none" stroke="#4B5563" stroke-width="1.2"/>
  <text x="630" y="20" font-family="sans-serif" font-size="13" fill="#4B5563">×</text>
  <rect x="12" y="36" width="86" height="24" rx="3" fill="#DDE2EA" stroke="#C5CDD8" stroke-width="0.75"/>
  <text x="55" y="51" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4B5563">Physical</text>
  <rect x="103" y="36" width="70" height="24" rx="3" fill="#DDE2EA" stroke="#C5CDD8" stroke-width="0.75"/>
  <text x="138" y="51" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4B5563">Config</text>
  <path d="M 178 60 L 178 36 Q 178 33 181 33 L 221 33 Q 224 33 224 36 L 224 60 Z" fill="#FFFFFF" stroke="#C5CDD8" stroke-width="1"/>
  <rect x="179" y="59" width="44" height="2" fill="#FFFFFF"/>
  <text x="201" y="51" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2937">CLI</text>
  <rect x="229" y="36" width="102" height="24" rx="3" fill="#DDE2EA" stroke="#C5CDD8" stroke-width="0.75"/>
  <text x="280" y="51" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#4B5563">Attributes</text>
  <g font-family="'DejaVu Sans Mono', 'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="14" fill="#111111">
    <text x="16" y="88" xml:space="preserve"><tspan fill="#0F172A" font-weight="700">R1#</tspan> show ip route</text>
    <text x="16" y="107" xml:space="preserve">Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP</text>
    <text x="16" y="126" xml:space="preserve">Gateway of last resort is 10.0.0.2 to network 0.0.0.0</text>
    <text x="16" y="145" xml:space="preserve"></text>
    <text x="16" y="164" xml:space="preserve">     10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks</text>
    <text x="16" y="183" xml:space="preserve"><tspan fill="#1D4ED8" font-weight="700">C</tspan>       10.0.0.0/30 is directly connected, Serial0/0/0</text>
    <text x="16" y="202" xml:space="preserve"><tspan fill="#1D4ED8" font-weight="700">L</tspan>       10.0.0.1/32 is directly connected, Serial0/0/0</text>
    <text x="16" y="221" xml:space="preserve"><tspan fill="#1D4ED8" font-weight="700">C</tspan>       192.168.1.0/24 is directly connected, GigabitEthernet0/0</text>
    <text x="16" y="240" xml:space="preserve"><tspan fill="#1D4ED8" font-weight="700">S*</tspan>   0.0.0.0/0 [1/0] via 10.0.0.2</text>
    <text x="16" y="259" xml:space="preserve"><tspan fill="#0F172A" font-weight="700">R1#</tspan></text>
  </g>
</svg>
