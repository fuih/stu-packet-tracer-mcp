  <g font-family="'DejaVu Sans Mono', 'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="13" fill="#000000">
    <text x="32" y="93" xml:space="preserve">R1# show ip route</text>
    <text x="32" y="110" xml:space="preserve">Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP</text>
    <text x="32" y="127" xml:space="preserve">Gateway of last resort is 10.0.0.2 to network 0.0.0.0</text>
    <text x="32" y="144" xml:space="preserve"></text>
    <text x="32" y="161" xml:space="preserve">     10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks</text>
    <text x="32" y="178" xml:space="preserve">C       10.0.0.0/30 is directly connected, Serial0/0/0</text>
    <text x="32" y="195" xml:space="preserve">L       10.0.0.1/32 is directly connected, Serial0/0/0</text>
    <text x="32" y="212" xml:space="preserve">C       192.168.1.0/24 is directly connected, GigabitEthernet0/0</text>
    <text x="32" y="229" xml:space="preserve">S*   0.0.0.0/0 [1/0] via 10.0.0.2</text>
    <text x="32" y="246" xml:space="preserve">R1#</text>
  </g>
  <line x1="56.5" y1="235" x2="56.5" y2="248" stroke="#000000" stroke-width="1.2"/>
