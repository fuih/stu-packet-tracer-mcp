  <text x="34" y="20" font-family="'DejaVu Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">R1 - PuTTY</text>
  <text x="594" y="20" font-family="'DejaVu Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#E5E7EB">—</text>
  <rect x="611" y="11" width="9" height="9" fill="none" stroke="#E5E7EB" stroke-width="1.2"/>
  <text x="630" y="20" font-family="'DejaVu Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#E5E7EB">×</text>
  <g font-family="'DejaVu Sans Mono', 'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="14" fill="#C0C0C0">
    <text x="16" y="60" xml:space="preserve"><tspan fill="#00FF00" font-weight="700">R1#</tspan> show ip route</text>
    <text x="16" y="79" xml:space="preserve">Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP</text>
    <text x="16" y="98" xml:space="preserve">Gateway of last resort is 10.0.0.2 to network 0.0.0.0</text>
    <text x="16" y="117" xml:space="preserve"></text>
    <text x="16" y="136" xml:space="preserve">     10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks</text>
    <text x="16" y="155" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">C</tspan>       10.0.0.0/30 is directly connected, Serial0/0/0</text>
    <text x="16" y="174" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">L</tspan>       10.0.0.1/32 is directly connected, Serial0/0/0</text>
    <text x="16" y="193" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">C</tspan>       192.168.1.0/24 is directly connected, GigabitEthernet0/0</text>
    <text x="16" y="212" xml:space="preserve"><tspan fill="#55AAFF" font-weight="700">S*</tspan>   0.0.0.0/0 [1/0] via 10.0.0.2</text>
    <text x="16" y="231" xml:space="preserve"><tspan fill="#00FF00" font-weight="700">R1#</tspan></text>
  </g>
